name: Test and Build

# 사이트(world.weniv.co.kr)는 이 저장소의 GitHub Pages가 직접 서비스합니다.
# 이 워크플로는 배포하지 않고, 푸시·PR마다 테스트와 빌드가 깨지지 않았는지만 확인합니다.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Python engine
        run: python -m unittest discover tests -v

      # JS 테스트에는 스토리 22편 모범 답안 검사(tests/story-solutions.test.mjs)가 포함됩니다.
      - name: Install, test and build
        run: |
          npm ci
          npm run test:js
          npm run build
